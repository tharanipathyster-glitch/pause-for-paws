name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 1,16 * *"   # 1st and 16th of every month, 11:00 UTC (6am Central): refresh from Iowa DOT
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh crash data from Iowa DOT
        # Pulls this year + last year from the live feature service; falls back to
        # the cached data/crashes-*.csv in the repo if the service is unreachable.
        run: python precompute_corridors.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fallback - bring this year's crashes in from ICAT
        # Used when the Iowa DOT feed is empty or behind. The script checks everything (row count, repeated case numbers,
        # dates, never fewer crashes than already saved) and only then replaces data/crashes-<year>.csv.
        # This step can never stop the deploy: on any problem it keeps the saved data and the alarm step at the end reports it.
        continue-on-error: true
        run: |
          set +e
          node scripts/icat-fetch.mjs "$(date -u +%Y)"
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "ICAT data brought in; rebuilding corridors from the saved files"
            python precompute_corridors.py --offline
          elif [ "$code" -eq 10 ]; then
            echo "Saved data already matches ICAT"
          else
            echo "::warning::ICAT fallback did not update the data (code $code); keeping the saved copy"
          fi
          exit 0

      - name: Copy the website into www/ for the app builds
        continue-on-error: true
        run: node scripts/sync-web.js

      - name: Save the refreshed crash data back to the repository
        # Keeps the latest good rows in the repo so a later empty answer from Iowa DOT falls back to them,
        # not to an old copy. Commits made with GITHUB_TOKEN do not start another workflow run.
        run: |
          git config user.name "pause-for-paws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/crashes-*.csv corridors.json data/corridors.json www
          if git diff --cached --quiet; then
            echo "No change to the saved crash data"
          else
            git commit -m "Data refresh: save latest Iowa DOT crash rows and generated corridor files [skip ci]"
            # GitHub occasionally answers a push with a passing server error; try a few times before giving up.
            for try in 1 2 3 4; do
              git push && break
              [ "$try" -eq 4 ] && exit 1
              sleep $((try * 10))
              git pull --rebase -q || true
            done
          fi

      - name: Assemble static site
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir -p dist
          cp index.html app.js styles.css privacy-policy.html corridors.json iowa-zips.json dot-brief.html app-store-badge.svg dist/
          echo "window.GOOGLE_MAPS_API_KEY = \"$GOOGLE_MAPS_API_KEY\";" > dist/google-maps-config.js
          # Cache-busting: stamp every asset URL with this commit so browsers never keep an old app.js
          V="${GITHUB_SHA::10}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$V\"|; s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|src=\"google-maps-config.js\"|src=\"google-maps-config.js?v=$V\"|" dist/index.html
          sed -i "s|fetch(\"corridors.json\")|fetch(\"corridors.json?v=$V\")|; s|fetch(\"iowa-zips.json\")|fetch(\"iowa-zips.json?v=$V\")|" dist/app.js
          echo "pauseforpawsusa.org" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Alarm - fail the run if this year's crash data is stale
        # Runs after the site has deployed, so a stale-data failure never blocks a release; it only makes GitHub email you.
        run: node scripts/check-freshness.mjs
