name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 1,16 * *"   # 1st and 16th of every month, 11:00 UTC (6am Central): refresh from Iowa DOT
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh crash data from Iowa DOT
        # Pulls this year + last year from the live feature service; falls back to
        # the cached data/crashes-*.csv in the repo if the service is unreachable.
        run: python precompute_corridors.py

      - name: Assemble static site
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          mkdir -p dist
          cp index.html app.js styles.css privacy-policy.html corridors.json iowa-zips.json dot-brief.html dist/
          echo "window.GOOGLE_MAPS_API_KEY = \"$GOOGLE_MAPS_API_KEY\";" > dist/google-maps-config.js
          # Cache-busting: stamp every asset URL with this commit so browsers never keep an old app.js
          V="${GITHUB_SHA::10}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$V\"|; s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|src=\"google-maps-config.js\"|src=\"google-maps-config.js?v=$V\"|" dist/index.html
          sed -i "s|fetch(\"corridors.json\")|fetch(\"corridors.json?v=$V\")|; s|fetch(\"iowa-zips.json\")|fetch(\"iowa-zips.json?v=$V\")|" dist/app.js
          echo "pauseforpawsusa.org" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
