name: Daily and weekly email report

on:
  schedule:
    # Daily: 7:03 PM Central. The clock moves, so cron fires at 00:03, 01:03 and 02:03 UTC and the
    # "Decide" step lets only the first one at or after 7 PM Central send (the others are backups).
    - cron: "3 0 * * *"
    - cron: "3 1 * * *"
    - cron: "3 2 * * *"
    # Mondays: weekly summary at about 8 AM Central, with a backup an hour later.
    - cron: "7 14 * * 1"
    - cron: "7 15 * * 1"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Send the weekly summary instead of the daily report"
        type: boolean
        default: false
      dry_run:
        description: "Build the report and print it, but do not send the email"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the mail library (kept out of the project's own dependencies)
        run: npm install --prefix .mail-deps nodemailer@6
      - name: Decide whether this run should send
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          send=true
          if [ "$EVENT" = "schedule" ]; then
            hour=$(TZ=America/Chicago date +%-H)
            case "$CRON" in
              "7 14 * * 1"|"7 15 * * 1") ok=true ;;
              *) if [ "$hour" -ge 19 ] && [ "$hour" -le 22 ]; then ok=true; else ok=false; fi ;;
            esac
            if [ "$ok" != "true" ]; then
              send=false; echo "Not yet 7 PM Central (hour $hour): skipping."
            else
              since=$(date -u -d '5 hours ago' +%Y-%m-%dT%H:%M:%SZ)
              for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-report.yml --event schedule --created ">=$since" --json databaseId --jq '.[].databaseId'); do
                [ "$id" = "$GITHUB_RUN_ID" ] && continue
                done_=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[].steps[] | select(.name=="Build and send the report" and .conclusion=="success")] | length')
                if [ "$done_" != "0" ]; then send=false; echo "Run $id already sent this report: skipping."; fi
              done
            fi
          fi
          echo "send=$send" >> "$GITHUB_OUTPUT"
      - name: Build and send the report
        if: steps.gate.outputs.send == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PLAY_BUCKET: ${{ secrets.PLAY_BUCKET }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR: ${{ secrets.ASC_VENDOR }}
          REPORT_MODE: ${{ (github.event.schedule == '7 14 * * 1' || github.event.schedule == '7 15 * * 1' || inputs.weekly) && 'weekly' || 'daily' }}
          WA_DRY: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/daily-report.mjs
