name: Daily email report

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC every day = 7:00 PM Central Standard Time (8:00 PM while daylight time is on, until 1 Nov)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the report and print it, but do not send the email"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the mail library (kept out of the project's own dependencies)
        run: npm install --prefix .mail-deps nodemailer@6
      - name: Build and send the report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PLAY_BUCKET: ${{ secrets.PLAY_BUCKET }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR: ${{ secrets.ASC_VENDOR }}
          WA_DRY: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/daily-report.mjs
