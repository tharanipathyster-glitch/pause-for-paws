name: Daily WhatsApp report

on:
  # schedule is switched off until the daily_report template is approved by Meta:
  # schedule:
  #   - cron: "0 0 * * *"   # 7:00 PM US Central in daylight time (use "0 1 * * *" after 1 Nov)
  workflow_dispatch:
    inputs:
      hello:
        description: "Send Meta hello_world instead of the report (connection test)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and send the report
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PLAY_BUCKET: ${{ secrets.PLAY_BUCKET }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR: ${{ secrets.ASC_VENDOR }}
          WA_HELLO: ${{ inputs.hello && '1' || '0' }}
        run: node scripts/daily-report.mjs
